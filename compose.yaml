# Local services for Duewise.
#   docker compose up -d                       start Postgres and Mailpit (run the app from your IDE)
#   docker compose --profile app up -d --build  also build and start the app itself on http://localhost:8080
#   docker compose --profile app down           stop everything (data is kept in the duewise-pgdata volume)
#   docker compose down -v                      stop and delete the database
name: duewise

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: duewise
      POSTGRES_USER: duewise
      POSTGRES_PASSWORD: duewise
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - duewise-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duewise -d duewise"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the app sends. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

  # The application, built from the Dockerfile. Only started with --profile app, so the normal
  # development setup (app in the IDE, services in Docker) is unchanged.
  app:
    profiles: ["app"]
    build: .
    image: duewise-invoicing-api:local
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # Inside Docker's network the services are reached by name, not localhost.
      DB_URL: jdbc:postgresql://postgres:5432/duewise
      DB_USERNAME: duewise
      DB_PASSWORD: duewise
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # Optional: taken from your shell or a .env file next to this one when set.
      BUSINESS_EMAIL: ${BUSINESS_EMAIL:-}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  duewise-pgdata:
