# Local development services for Duewise.
#   docker compose up -d     start Postgres and Mailpit
#   docker compose down      stop them (data is kept in the duewise-pgdata volume)
#   docker compose down -v   stop them and delete the database
name: duewise

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: duewise
      POSTGRES_USER: duewise
      POSTGRES_PASSWORD: duewise
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - duewise-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duewise -d duewise"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the app sends. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

volumes:
  duewise-pgdata:
