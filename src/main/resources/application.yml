spring:
  application:
    name: duewise
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duewise}
    username: ${DB_USERNAME:duewise}
    password: ${DB_PASSWORD:duewise}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

duewise:
  api:
    version: 0.1.0
