<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title th:text="'Invoice ' + ${doc.label()}">Invoice</title>
</head>
<body style="margin: 0; padding: 24px; background: #f6f8fa; font-family: Helvetica, Arial, sans-serif; color: #1f2328;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; margin: 0 auto; background: #ffffff; border: 1px solid #d1d9e0; border-radius: 8px;">
    <tr>
        <td style="padding: 28px 32px;">
            <p style="margin: 0 0 4px; font-size: 13px; color: #59636e;" th:text="${doc.businessName()}">Business</p>
            <h1 style="margin: 0 0 20px; font-size: 20px;" th:text="'Invoice ' + ${doc.label()}">Invoice</h1>

            <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.5;" th:text="'Hello ' + ${doc.clientName()} + ','">Hello,</p>
            <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.5;" th:if="${doc.paid()}"
               th:text="'Please find attached invoice ' + ${doc.label()} + ', issued on ' + ${doc.issueDate()} + '. It is paid in full; this copy is for your records.'">
                Paid text
            </p>
            <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.5;" th:unless="${doc.paid()}"
               th:text="'Please find attached invoice ' + ${doc.label()} + ', issued on ' + ${doc.issueDate()} + ' and due on ' + ${doc.dueDate()} + '.'">
                Invoice text
            </p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top: 1px solid #d1d9e0; border-bottom: 1px solid #d1d9e0; margin-bottom: 20px;">
                <tr>
                    <td style="padding: 10px 0; font-size: 14px; color: #59636e;">Invoice total</td>
                    <td style="padding: 10px 0; font-size: 14px; text-align: right;" th:text="${doc.total()}">INR 0.00</td>
                </tr>
                <tr>
                    <td style="padding: 0 0 10px; font-size: 14px; color: #59636e;">Already paid</td>
                    <td style="padding: 0 0 10px; font-size: 14px; text-align: right;" th:text="${doc.amountPaid()}">INR 0.00</td>
                </tr>
                <tr>
                    <td style="padding: 10px 0; font-size: 16px; font-weight: bold; border-top: 1px solid #d1d9e0;">Balance due</td>
                    <td style="padding: 10px 0; font-size: 16px; font-weight: bold; text-align: right; border-top: 1px solid #d1d9e0;" th:text="${doc.balanceDue()}">INR 0.00</td>
                </tr>
            </table>

            <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.5; white-space: pre-line;"
               th:if="${doc.notes() != null and !doc.notes().isBlank()}" th:text="${doc.notes()}">Notes</p>
            <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #59636e;"
               th:text="${doc.businessEmail() != null and !doc.businessEmail().isBlank()}
                        ? 'Questions? Reply to this email or write to ' + ${doc.businessEmail()} + '.'
                        : 'Questions? Reply to this email.'">Questions?</p>
        </td>
    </tr>
</table>
</body>
</html>
